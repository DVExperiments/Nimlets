# Builds the web version of Nimlets and publishes it on GitHub Pages, so it can be
# played in any browser, including on phones: https://<your-name>.github.io/Nimlets/
#  - Runs whenever the main branch changes, or on demand ("Run workflow" on the Actions tab).
#  - One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Build web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the build needs
        run: python -m pip install --upgrade -r requirements.txt pygbag

      - name: Run the tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests

      - name: Build the web version
        env:
          SDL_VIDEODRIVER: dummy
        run: python tools/build_web.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
